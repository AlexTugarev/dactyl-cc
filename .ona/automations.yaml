tasks:
    configure:
        name: Configure CMake
        command: |
            cd build
            cmake ../src
        triggeredBy:
        - postDevcontainerStart

    build:
        name: Build Project
        command: |
            cd build
            make
        triggeredBy:
        - manual

    run:
        name: Build and Run
        command: |
            cd build
            make && ./dactyl
        triggeredBy:
        - manual

    clean:
        name: Clean Build
        command: |
            cd build
            rm -rf *
        triggeredBy:
        - manual

    rebuild:
        name: Rebuild from Scratch
        command: |
            cd build
            rm -rf *
            cmake ../src
            make
        triggeredBy:
        - manual

    generate-stl:
        name: Generate STL Files
        command: |
            cd build
            if [ -f v1_left.scad ]; then
                openscad -o ../things/v1_left.stl v1_left.scad
                echo "Generated v1_left.stl"
            fi
            if [ -f v1_right.scad ]; then
                openscad -o ../things/v1_right.stl v1_right.scad
                echo "Generated v1_right.stl"
            fi
        triggeredBy:
        - manual

